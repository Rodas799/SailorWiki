<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Races | Sailor Piece Wiki Oficial</title>

    <link rel="stylesheet" href="../css/global.css">
    
    <link rel="stylesheet" href="../css/races.css">
    <link rel="icon" type="image/png" href="./assets/sailor_wiki_favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

   <header>
    <!-- LOGO -->
    <a href="https://rodas799.github.io/SailorWiki">
        <img src="./assets/logobgpng.png" alt="Sailor Wiki">
    </a>
      
    <nav>
        <ul>
            <!-- NAVBAR COM LINKS ABSOLUTOS -->
            <li><a href="https://rodas799.github.io/SailorWiki/index.html">Início</a></li> 
            
            <li class="dropdown">
                <a href="javascript:void(0)" class="dropbtn">
                    Wiki <i class="fas fa-caret-down"></i>
                </a>
                <div class="dropdown-content">
                    <a href="https://rodas799.github.io/SailorWiki/pages/races.html">Races</a>
                    <a href="https://rodas799.github.io/SailorWiki/pages/clans.html">Clans</a>
                    <a href="https://rodas799.github.io/SailorWiki/pages/fruits.html">Fruits</a>
                    <a href="https://rodas799.github.io/SailorWiki/pages/swords.html">Swords</a>
                    <a href="https://rodas799.github.io/SailorWiki/pages/melees.html">Melees</a>
                    <a href="https://rodas799.github.io/SailorWiki/pages/runes.html">Runes</a>
                    <a href="https://rodas799.github.io/SailorWiki/pages/traits.html">Traits</a>
                    <a href="https://rodas799.github.io/SailorWiki/pages/accessories.html">Accessories</a>
                </div>
            </li>

            <li><a href="https://rodas799.github.io/SailorWiki/pages/tierlists.html" class="highlight">Tierlists</a></li>
            <li><a href="https://rodas799.github.io/SailorWiki/pages/builds.html">Builds</a></li>
        </ul>
    </nav>

    <div class="nav-actions">
        <button class="btn-main" onclick="window.open('https://www.roblox.com/games/77747658251236/Sailor-Piece#!/about')">
            Jogar Agora
        </button>
    </div>
</header>

    <main class="wiki-container">
        <section class="wiki-header">
            <h1 class="aurora-text">Races Database</h1>
        </section>
        <div class="search-section">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="race-search" placeholder="Procurar linhagem ou atributo..." autocomplete="off">
                <div class="search-line"></div>
            </div>
        </div>
        <div class="table-wrapper">
            <div class="table-header">
                <div class="col-main">Races</div>
                <div class="col-stats">Stats</div>
            </div>
            
            <div id="races-container" class="races-list">
                <div class="loading-state">
                    <i class="fas fa-circle-notch fa-spin"></i> Acessando Arquivos Estelares...
                </div>
            </div>
        </div>
    </main>

    <script src="./js/races.js"></script>
    
    <script>
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
